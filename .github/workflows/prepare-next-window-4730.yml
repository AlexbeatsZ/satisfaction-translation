name: Generate proofreading window 4730-5229

on:
  push:
    branches:
      - translation-proofreading-v2
    paths:
      - '.github/workflows/prepare-next-window-4730.yml'

concurrency:
  group: proofreading-next-window-4730
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-v2
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Rebuild generated proofreading files
        run: |
          python proofreading/expand_compact_manifests.py
          python proofreading/sync_proofreading_v3.py
          python proofreading/update_progress_with_skips.py
          python proofreading/update_readme_status.py
          python proofreading/analyze_chapter_order.py

      - name: Commit generated files and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-next-window-4730.yml
          git add \
            README.md \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            PROOFREADING_PROGRESS.md \
            proofreading
          git commit -m 'proofread: prepare entries 4730-5229'
          git fetch origin translation-proofreading-v2
          git rebase origin/translation-proofreading-v2
          git push origin HEAD:translation-proofreading-v2
