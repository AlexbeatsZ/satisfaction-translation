name: Prepare proofreading range 3730-4229

on:
  push:
    branches:
      - translation-proofreading-3730-4229
    paths:
      - '.github/workflows/proofreading-3730-4229.yml'
      - 'proofreading/request.json'
      - 'proofreading/claims/**'
      - 'proofreading/split_current_batch.py'
      - 'proofreading/reviewed-batch-*.json'

concurrency:
  group: proofreading-3730-4229
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-3730-4229
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Expand manifests and prepare batch
        run: |
          python proofreading/expand_compact_manifests.py
          python proofreading/sync_proofreading_v3.py
          python proofreading/update_progress_with_skips.py
          python proofreading/update_readme_status.py
          python proofreading/analyze_chapter_order.py
          python proofreading/split_current_batch.py

      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            PROOFREADING_PROGRESS.md \
            proofreading/current-batch.md \
            proofreading/current-batch.tsv \
            proofreading/tsv-alignment-report.md \
            proofreading/chapter-order-analysis.md \
            proofreading/work/003730-004229 \
            proofreading/reviewed-batch-*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: entries 3730-4229'
          git push origin HEAD:translation-proofreading-3730-4229
