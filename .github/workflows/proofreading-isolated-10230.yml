name: Apply isolated proofreading 10230-10729

on:
  push:
    branches:
      - translation-proofreading-10230-10729

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[apply-10230]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-10230-10729
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Build and apply reviewed manifests
        run: |
          python proofreading/build_review_manifests_10230.py
          python proofreading/expand_compact_manifests.py
          python proofreading/sync_proofreading_v3.py
          python proofreading/update_progress_with_skips.py
          python proofreading/update_readme_status.py
          python proofreading/analyze_chapter_order.py

      - name: Commit synchronized results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            PROOFREADING_PROGRESS.md \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: apply entries 10230-10729'
          git push origin HEAD:translation-proofreading-10230-10729
