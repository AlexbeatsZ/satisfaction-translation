name: Prepare proofreading batch

on:
  push:
    branches:
      - main
      - translation-proofreading-v2
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'
      - 'proofreading/reviewed-batch-*.json'
      - 'proofreading/sync_proofreading.py'
      - 'proofreading/diagnose_misalignment.py'
      - 'terminology.yaml'
      - 'glossary.json'
  pull_request:
    branches:
      - main

concurrency:
  group: proofreading-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-v2
          fetch-depth: 0

      - name: Import reviewed state from backup branch
        run: |
          git fetch origin main translation-proofreading
          mkdir -p proofreading
          git ls-tree -r --name-only origin/translation-proofreading proofreading \
            | grep -E '^proofreading/(reviewed-batch-.*\.json|request\.json|sync_proofreading\.py|diagnose_misalignment\.py)$' \
            | while read -r path; do
                git show "origin/translation-proofreading:$path" > "$path"
              done
          git show origin/translation-proofreading:PROOFREADING_PROGRESS.md > PROOFREADING_PROGRESS.md
          git show origin/translation-proofreading:terminology.yaml > terminology.yaml

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Align, apply reviews, and build next batch
        run: python proofreading/sync_proofreading.py

      - name: Diagnose source-target misalignment
        run: python proofreading/diagnose_misalignment.py

      - name: Commit corrected and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            terminology.yaml \
            glossary.json \
            PROOFREADING_PROGRESS.md \
            proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: rebuild reviewed text on clean main baseline'
          git fetch origin translation-proofreading-v2
          git rebase origin/translation-proofreading-v2
          git push origin HEAD:translation-proofreading-v2
