name: Prepare proofreading batch

on:
  push:
    branches:
      - translation-proofreading
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading
          fetch-depth: 0

      - name: Build readable batch
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          request_path = Path('proofreading/request.json')
          request = json.loads(request_path.read_text(encoding='utf-8')) if request_path.exists() else {'start': 1, 'count': 40}
          start = int(request.get('start', 1))
          count = int(request.get('count', 40))

          with Path('satisfaction-text.tsv').open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          selected = []
          for index, row in enumerate(rows[start - 1:start - 1 + count], start=start):
              selected.append({
                  'index': index,
                  'file': row.get('file', ''),
                  'line': row.get('line', ''),
                  'kind': row.get('kind', ''),
                  'voice': row.get('voice', ''),
                  'source': row.get('source', ''),
                  'translation': row.get('translation', ''),
              })

          out = Path('proofreading')
          out.mkdir(exist_ok=True)
          fields = ['index', 'file', 'line', 'kind', 'voice', 'source', 'translation']
          with (out / 'current-batch.tsv').open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(selected)

          last = start + len(selected) - 1
          md = ['# 当前校对批次', '', f'- 请求范围：第 {start}–{last} 条', f'- 实际条数：{len(selected)}', '']
          for row in selected:
              md.extend([
                  f'## 条目 {row["index"]}',
                  '',
                  f'- **定位：** `{row["file"]}:{row["line"]}`',
                  f'- **类型：** `{row["kind"]}`',
                  f'- **语音：** `{row["voice"]}`',
                  f'- **日文：** {row["source"]}',
                  f'- **中文：** {row["translation"]}',
                  '',
              ])
          (out / 'current-batch.md').write_text('\n'.join(md), encoding='utf-8')

          # Export the beginning of the actual Chinese Markdown/TXT files.
          for source_name, output_name, limit in [
              ('satisfaction-scripts.zh.md', 'translated-markdown-head.md', 320),
              ('satisfaction-scripts.zh.txt', 'translated-text-head.txt', 240),
          ]:
              source_path = Path(source_name)
              if source_path.exists():
                  lines = source_path.read_text(encoding='utf-8-sig').splitlines()
                  (out / output_name).write_text('\n'.join(lines[:limit]), encoding='utf-8')

          # Inspect JSON shape and representative nested objects without copying the full file.
          json_path = Path('satisfaction-scripts.zh.json')
          report = ['# 翻译 JSON 结构检查', '']
          if json_path.exists():
              data = json.loads(json_path.read_text(encoding='utf-8-sig'))
              report.append(f'- 顶层类型：`{type(data).__name__}`')
              if isinstance(data, dict):
                  report.append(f'- 顶层键：`{list(data.keys())}`')
              elif isinstance(data, list):
                  report.append(f'- 顶层长度：`{len(data)}`')
              report.append('')

              seen = 0
              def walk(node, path='$'):
                  global seen
                  if seen >= 60:
                      return
                  if isinstance(node, dict):
                      strings = {k: v for k, v in node.items() if isinstance(v, str) and v.strip()}
                      if strings:
                          report.extend([f'## `{path}`', '', f'- 键：`{list(node.keys())}`'])
                          for key, value in list(strings.items())[:10]:
                              compact = value.replace('\n', '\\n')
                              report.append(f'- **{key}：** {compact[:240]}')
                          report.append('')
                          seen += 1
                      for key, value in node.items():
                          walk(value, f'{path}.{key}')
                          if seen >= 60:
                              return
                  elif isinstance(node, list):
                      for i, value in enumerate(node[:200]):
                          walk(value, f'{path}[{i}]')
                          if seen >= 60:
                              return
              walk(data)
          else:
              report.append('- 未找到 JSON 文件。')
          (out / 'json-inspection.md').write_text('\n'.join(report), encoding='utf-8')

      - name: Commit generated batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: inspect translated script sources'
          git push origin HEAD:translation-proofreading
