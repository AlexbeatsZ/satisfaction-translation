name: Prepare proofreading batch

on:
  push:
    branches:
      - main
      - translation-proofreading-v2
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'
      - 'proofreading/reviewed-batch-*.json'
      - 'proofreading/sync_proofreading_v2.py'
      - 'proofreading/diagnose_misalignment.py'
      - 'proofreading/analyze_chapter_order.py'
      - 'terminology.yaml'
      - 'glossary.json'
  pull_request:
    branches:
      - main

concurrency:
  group: proofreading-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-v2
          fetch-depth: 0

      - name: Import reviewed state from backup branch
        run: |
          git fetch origin main translation-proofreading
          mkdir -p proofreading
          git ls-tree -r --name-only origin/translation-proofreading proofreading \
            | grep -E '^proofreading/(reviewed-batch-.*\.json|request\.json|diagnose_misalignment\.py)$' \
            | while read -r path; do
                git show "origin/translation-proofreading:$path" > "$path"
              done
          git show origin/translation-proofreading:terminology.yaml > terminology.yaml

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Normalize source metadata for verification
        shell: python
        run: |
          from pathlib import Path
          path = Path('proofreading/sync_proofreading_v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              're.compile(r"^【話者：[^】]*】")',
              're.compile(r"^【話者[:：][^】]*】")',
          )
          text = text.replace(
              '    text = SPEAKER_PREFIX_RE.sub("", text, count=1)\n    return WHITESPACE_RE.sub("", text)',
              '    text = SPEAKER_PREFIX_RE.sub("", text, count=1)\n'
              '    text = re.sub(r"(?<=[\\u3400-\\u9fff々ヶ])\\([ぁ-ゖァ-ヺー]+\\)", "", text)\n'
              '    text = re.sub(r"<[ぁ-ゖァ-ヺー]+>", "", text)\n'
              '    return WHITESPACE_RE.sub("", text)',
          )
          path.write_text(text, encoding='utf-8')

      - name: Verify and apply reviewed entries
        run: python proofreading/sync_proofreading_v2.py

      - name: Diagnose source-target misalignment
        run: python proofreading/diagnose_misalignment.py

      - name: Analyze chapter ordering
        run: python proofreading/analyze_chapter_order.py

      - name: Commit corrected and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            terminology.yaml \
            glossary.json \
            PROOFREADING_PROGRESS.md \
            proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: refresh chapter-order diagnostics'
          git fetch origin translation-proofreading-v2
          git rebase origin/translation-proofreading-v2
          git push origin HEAD:translation-proofreading-v2
