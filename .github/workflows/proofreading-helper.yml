name: Prepare proofreading batch
# Canonical working branch: translation-proofreading-v2
# Large-batch compact manifest support

on:
  push:
    branches:
      - main
      - translation-proofreading-v2
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'
      - 'proofreading/reviewed-batch-*.json'
      - 'proofreading/skipped-ranges.json'
      - 'proofreading/claims/**'
      - 'proofreading/expand_compact_manifests.py'
      - 'proofreading/update_progress_with_skips.py'
      - 'proofreading/update_readme_status.py'
      - 'proofreading/sync_proofreading_v3.py'
      - 'proofreading/analyze_chapter_order.py'
      - 'terminology.yaml'
      - 'glossary.json'
  pull_request:
    branches:
      - main

concurrency:
  group: proofreading-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-v2
          fetch-depth: 0

      - name: Import missing historical review manifests
        run: |
          git fetch origin translation-proofreading
          mkdir -p proofreading
          git ls-tree -r --name-only origin/translation-proofreading proofreading \
            | grep -E '^proofreading/reviewed-batch-.*\.json$' \
            | while read -r path; do
                if [ ! -f "$path" ]; then
                  git show "origin/translation-proofreading:$path" > "$path"
                fi
              done

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Expand compact review manifests
        run: python proofreading/expand_compact_manifests.py

      - name: Apply reviews and align TSV by file-local order
        run: python proofreading/sync_proofreading_v3.py

      - name: Rebuild progress with skipped ranges
        run: python proofreading/update_progress_with_skips.py

      - name: Rebuild README status
        run: python proofreading/update_readme_status.py

      - name: Analyze chapter ordering
        run: python proofreading/analyze_chapter_order.py

      - name: Commit corrected and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            terminology.yaml \
            glossary.json \
            PROOFREADING_PROGRESS.md \
            proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: apply reviewed batch and refresh next window'
          git fetch origin translation-proofreading-v2
          git rebase origin/translation-proofreading-v2
          git push origin HEAD:translation-proofreading-v2
