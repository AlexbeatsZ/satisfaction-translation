name: Prepare proofreading batch

on:
  push:
    branches:
      - translation-proofreading
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading
          fetch-depth: 0

      - name: Build readable batch
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          request_path = Path('proofreading/request.json')
          request = json.loads(request_path.read_text(encoding='utf-8')) if request_path.exists() else {'start': 1, 'count': 40}
          start = int(request.get('start', 1))
          count = int(request.get('count', 40))

          with Path('satisfaction-text.tsv').open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          selected = []
          for index, row in enumerate(rows[start - 1:start - 1 + count], start=start):
              selected.append({
                  'index': index,
                  'file': row.get('file', ''),
                  'line': row.get('line', ''),
                  'kind': row.get('kind', ''),
                  'voice': row.get('voice', ''),
                  'source': row.get('source', ''),
                  'translation': row.get('translation', ''),
              })

          out = Path('proofreading')
          out.mkdir(exist_ok=True)
          fields = ['index', 'file', 'line', 'kind', 'voice', 'source', 'translation']
          with (out / 'current-batch.tsv').open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(selected)

          last = start + len(selected) - 1
          md = ['# 当前校对批次', '', f'- 请求范围：第 {start}–{last} 条', f'- 实际条数：{len(selected)}', '']
          for row in selected:
              md.extend([
                  f'## 条目 {row["index"]}',
                  '',
                  f'- **定位：** `{row["file"]}:{row["line"]}`',
                  f'- **类型：** `{row["kind"]}`',
                  f'- **语音：** `{row["voice"]}`',
                  f'- **日文：** {row["source"]}',
                  f'- **中文：** {row["translation"]}',
                  '',
              ])
          (out / 'current-batch.md').write_text('\n'.join(md), encoding='utf-8')

      - name: Commit generated batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proofreading/current-batch.tsv proofreading/current-batch.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: prepare proofreading batch'
          git push origin HEAD:translation-proofreading
