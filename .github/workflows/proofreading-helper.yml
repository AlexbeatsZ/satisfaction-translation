name: Prepare proofreading batch

on:
  push:
    branches:
      - translation-proofreading
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'
      - 'proofreading/reviewed-batch-*.json'
      - 'proofreading/sync_proofreading.py'
      - 'terminology.yaml'
      - 'glossary.json'
  pull_request:
    branches:
      - main

concurrency:
  group: proofreading-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading
          fetch-depth: 0

      - name: Import terminology files from main once
        run: |
          git fetch origin main
          for file in terminology.yaml glossary.json; do
            if [ ! -f "$file" ]; then
              git checkout origin/main -- "$file"
            fi
          done

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Align, apply reviews, and build next batch
        run: python proofreading/sync_proofreading.py

      - name: Commit corrected and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            terminology.yaml \
            glossary.json \
            proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: apply source-aligned reviews and refresh batch'
          git fetch origin translation-proofreading
          git rebase origin/translation-proofreading
          git push origin HEAD:translation-proofreading
