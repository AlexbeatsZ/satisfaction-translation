name: Prepare proofreading batch

on:
  push:
    branches:
      - translation-proofreading
    paths:
      - '.github/workflows/proofreading-helper.yml'
      - 'proofreading/request.json'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading
          fetch-depth: 0

      - name: Build readable batch
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          request_path = Path('proofreading/request.json')
          if request_path.exists():
              request = json.loads(request_path.read_text(encoding='utf-8'))
          else:
              request = {'start': 1, 'count': 40}

          start = int(request.get('start', 1))
          count = int(request.get('count', 40))

          with Path('satisfaction-text.tsv').open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          selected = rows[start - 1:start - 1 + count]
          out = Path('proofreading')
          out.mkdir(exist_ok=True)

          with (out / 'current-batch.tsv').open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=['id', 'ja', 'zh', 'en'], delimiter='\t', lineterminator='\n')
              writer.writeheader()
              writer.writerows(selected)

          md = [
              '# 当前校对批次',
              '',
              f'- 请求范围：第 {start}–{start + len(selected) - 1} 条',
              f'- 实际条数：{len(selected)}',
              '',
          ]
          for offset, row in enumerate(selected, start=start):
              md.extend([
                  f'## 条目 {offset}（ID: {row.get("id", "")}）',
                  '',
                  f'- **日文：** {row.get("ja", "")}',
                  f'- **中文：** {row.get("zh", "")}',
                  f'- **英文：** {row.get("en", "")}',
                  '',
              ])
          (out / 'current-batch.md').write_text('\n'.join(md), encoding='utf-8')

      - name: Commit generated batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proofreading/current-batch.tsv proofreading/current-batch.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: prepare proofreading batch'
          git push origin HEAD:translation-proofreading
