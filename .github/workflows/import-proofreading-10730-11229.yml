name: Import proofreading 10730-11229

on:
  push:
    branches:
      - translation-proofreading-v2-import-10730
    paths:
      - '.github/workflows/import-proofreading-10730-11229.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-v2-import-10730
          fetch-depth: 0
      - name: Import reviewed batch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .proofreading-import-10730/corrections-1.json /tmp/corrections-1.json
          cp .proofreading-import-10730/corrections-2.json /tmp/corrections-2.json
          cp .proofreading-import-10730/corrections-3.json /tmp/corrections-3.json
          cp .proofreading-import-10730/corrections-4.json /tmp/corrections-4.json
          echo 'a1f57b34e36cd9753a428b7f48db1d9048d3eb47d4bd88f508068ed2fd948e23  /tmp/corrections-1.json' | sha256sum -c -
          echo 'dad9a5057b9b3878181844cffc50fa4f24103c54146d8e9bf668a4db8de09461  /tmp/corrections-2.json' | sha256sum -c -
          echo '8d85033c73813a7fd6ae13d96a2d084ea3296b64100b7d69428b23825997986b  /tmp/corrections-3.json' | sha256sum -c -
          echo '933686e472557dc87f9ea5d79a9f3c9f82320ce7a5f4755c835329ada81125e4  /tmp/corrections-4.json' | sha256sum -c -
          python -m pip install --quiet pyyaml

          pushed=0
          for attempt in $(seq 1 12); do
            echo "Import attempt ${attempt}"
            git fetch origin translation-proofreading-v2
            git reset --hard origin/translation-proofreading-v2
            git clean -fd

            python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          out = root / 'proofreading'
          corrections = {}
          for path in [
              Path('/tmp/corrections-1.json'),
              Path('/tmp/corrections-2.json'),
              Path('/tmp/corrections-3.json'),
              Path('/tmp/corrections-4.json'),
          ]:
              payload = json.loads(path.read_text(encoding='utf-8'))
              for key, value in payload.items():
                  index = int(key)
                  if index in corrections:
                      raise RuntimeError(f'duplicate correction index: {index}')
                  corrections[index] = str(value)
          if len(corrections) != 337:
              raise RuntimeError(f'expected 337 corrections, got {len(corrections)}')
          if any(index < 10730 or index > 11229 for index in corrections):
              raise RuntimeError('correction outside target range')

          reviewed = set()
          for path in sorted(out.glob('reviewed-batch-*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              rp = payload.get('range')
              if rp:
                  indices = set(range(int(rp['start']), int(rp['end']) + 1))
              else:
                  indices = {int(entry['index']) for entry in payload.get('entries', [])}
              reviewed |= indices
          skipped_payload = json.loads((out / 'skipped-ranges.json').read_text(encoding='utf-8'))
          skipped = set()
          for item in skipped_payload.get('ranges', []):
              skipped |= set(range(int(item['start']), int(item['end']) + 1))
          overlap = sorted(set(range(10730, 11230)) & (reviewed | skipped))
          if overlap:
              raise RuntimeError(f'target range already handled: {overlap[:20]}')

          for start in range(10730, 11230, 50):
              end = start + 49
              manifest = {
                  'range': {'start': start, 'end': end},
                  'reviewed_at': '2026-08-06',
                  'format': 'compact-v1',
                  'entries': [
                      {'index': index, 'new_target': corrections[index]}
                      for index in sorted(corrections)
                      if start <= index <= end
                  ],
              }
              path = out / f'reviewed-batch-{start:06d}-{end:06d}.json'
              path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          claim = out / 'claims/active/010730-011229-openai-chatgpt.json'
          if claim.exists():
              claim.unlink()
          print(f'Prepared 10730-11229 with {len(corrections)} corrections')
          PY

            python proofreading/expand_compact_manifests.py
            python proofreading/sync_proofreading_v3.py
            python proofreading/update_progress_with_skips.py
            python proofreading/analyze_chapter_order.py
            python proofreading/check_active_claims.py
            git diff --check
            git add -A
            if git diff --cached --quiet; then
              echo 'No changes remain to import.'
              pushed=1
              break
            fi
            git commit -m 'proofread: import reviewed entries 10730-11229'
            if git push origin HEAD:translation-proofreading-v2; then
              pushed=1
              break
            fi
            echo 'Canonical branch moved; retrying from latest head.'
            sleep 3
          done

          if [ "$pushed" -ne 1 ]; then
            echo 'Failed to push after retries.' >&2
            exit 1
          fi
