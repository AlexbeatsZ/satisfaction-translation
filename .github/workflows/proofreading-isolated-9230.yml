name: Apply isolated proofreading 9230-9729

on:
  push:
    branches:
      - translation-proofreading-9230-9729
    paths:
      - '.github/workflows/proofreading-isolated-9230.yml'

concurrency:
  group: proofreading-isolated-9230-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-9230-9729
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Remove no-op entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          removed = []
          for path in sorted(Path('proofreading').glob('reviewed-batch-009*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              entries = payload.get('entries', [])
              kept = []
              for entry in entries:
                  if str(entry.get('new_target', '')) == str(entry.get('old_target', '')):
                      removed.append(int(entry['index']))
                  else:
                      kept.append(entry)
              payload['entries'] = kept
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'removed no-op entries: {removed}')
          PY

      - name: Expand and apply reviewed entries
        run: |
          python proofreading/expand_compact_manifests.py
          python proofreading/sync_proofreading_v3.py
          python proofreading/update_progress_with_skips.py
          python proofreading/update_readme_status.py
          python proofreading/analyze_chapter_order.py
          python proofreading/check_active_claims.py

      - name: Commit synchronized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            satisfaction-scripts.zh.json \
            satisfaction-scripts.zh.md \
            satisfaction-scripts.zh.txt \
            satisfaction-text.tsv \
            PROOFREADING_PROGRESS.md \
            proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: remove no-op entries 9230-9729'
          git push origin HEAD:translation-proofreading-9230-9729
