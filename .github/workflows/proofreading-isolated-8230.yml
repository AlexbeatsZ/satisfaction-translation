name: Isolated proofreading 8230-8729

on:
  push:
    branches:
      - translation-proofreading-8230-8729
    paths:
      - '.github/workflows/proofreading-isolated-8230.yml'
      - 'proofreading/request.json'
      - 'proofreading/review-input-008230-008729.json'
      - 'proofreading/build_review_manifests_8230.py'
      - 'proofreading/reviewed-batch-*.json'
      - 'proofreading/skipped-ranges.json'
      - 'proofreading/claims/**'

permissions:
  contents: write

concurrency:
  group: proofreading-isolated-8230-8729
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-proofreading-8230-8729
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml

      - name: Build review manifests
        run: python proofreading/build_review_manifests_8230.py

      - name: Expand compact manifests
        run: python proofreading/expand_compact_manifests.py

      - name: Apply reviews and prepare batch
        run: python proofreading/sync_proofreading_v3.py

      - name: Rebuild progress
        run: python proofreading/update_progress_with_skips.py

      - name: Rebuild README status
        run: python proofreading/update_readme_status.py

      - name: Analyze chapter ordering
        run: python proofreading/analyze_chapter_order.py

      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROOFREADING_PROGRESS.md satisfaction-scripts.zh.json satisfaction-scripts.zh.md satisfaction-scripts.zh.txt satisfaction-text.tsv proofreading
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: apply entries 8230-8729'
          git push origin HEAD:translation-proofreading-8230-8729
