name: Prepare proofreading 11730-12229

on:
  push:
    branches:
      - translation-proofreading-11730-12229
    paths:
      - '.github/workflows/prepare-proofreading-11730-12229.yml'
      - 'proofreading/request.json'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "refs/remotes/origin/${GITHUB_REF_NAME}"
      - name: Install YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Generate requested batch
        run: |
          python proofreading/expand_compact_manifests.py
          python proofreading/sync_proofreading_v3.py
          python proofreading/update_progress_with_skips.py
          python proofreading/analyze_chapter_order.py
          python proofreading/check_active_claims.py
      - name: Commit generated batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proofreading/current-batch.tsv proofreading/current-batch.md proofreading/tsv-alignment-report.md proofreading/chapter-order-analysis.md PROOFREADING_PROGRESS.md satisfaction-scripts.zh.json satisfaction-scripts.zh.md satisfaction-scripts.zh.txt satisfaction-text.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'proofread: generate entries 11730-12229'
          git push origin HEAD:translation-proofreading-11730-12229
